  #   environment:
  #     MYSQL_ROOT_PASSWORD: rootpass
  #     MYSQL_DATABASE: suitecrm
  #     MYSQL_USER: suitecrm
  #     MYSQL_PASSWORD: suitecrm123
  #   volumes:
  #     - db_data:/var/lib/mysql

volumes:
  # db_data:
  suitecrm_upload:
