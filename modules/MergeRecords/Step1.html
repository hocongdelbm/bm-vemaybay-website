<script src="include/javascript/quicksearch.js?v={VERSION_MARK}" type="text/javascript"></script>
<form name="DedupSetup" id="DedupSetup" method="POST" action="index.php">
	<input type="hidden" name="module" value="MergeRecords" />
	<input type="hidden" name="merge_module" value="{MERGE_MODULE}" />
	<input type="hidden" name="record" value="{ID}" />
	<input type="hidden" name="action" value="Step2" />
	<input type="hidden" name="return_module" value="{RETURN_MODULE}" />
	<input type="hidden" name="return_id" value="{RETURN_ID}" />
	<input type="hidden" name="return_action" value="{RETURN_ACTION}" />
	<input type="hidden" name="dedup_fields" value="" />
	<input type="hidden" name="num_fields" value="0" />

	<table cellpadding="0" cellspacing="0" border="0" width="100%" class="table-MergeRecords table-merge__step1">
		<tr>
			<td>
				<input title="{MOD.LBL_NEXT_STEP_TITLE}" class="btn btn-primary" onclick="this.form.action.value='Step2';" type="submit" name="button" value="  {MOD.LBL_NEXT_STEP_BUTTON_LABEL}  " id="next_step_button">
				<input title="{APP.LBL_CANCEL_BUTTON_TITLE}" accessKey="{APP.LBL_CANCEL_BUTTON_KEY}" class="btn btn-danger" onclick="this.form.action.value='{RETURN_ACTION}'; this.form.module.value='{RETURN_MODULE}'; this.form.record.value='{RETURN_ID}';" type="submit" name="button" value="  {APP.LBL_CANCEL_BUTTON_LABEL}  " id="cancel_merge_button">
			</td>
			<td align='right'>{ADMIN_EDIT}</td>
		</tr>
	</table>

	<div class="box-section">
		<table width="100%" border="0" cellspacing="0" cellpadding="0" class="list view table-config">
			<!-- BEGIN: select_module -->
			<tr>
				<td width="45%"><span>{MOD.LBL_SELECT_MODULE}:</span></td>
				<td width="5%"><span>&nbsp;</span></td>
				<td width="50%"><span>&nbsp;</span></td>
			</tr>
			<tr>
				<td width="45%"><span><select name="selected_module" id="selected_module"
							onchange="grab_fields();">{MIGRATION_MODULE_OPTIONS}</select></span></td>
				<td width="5%"><span>&nbsp;</span></td>
				<td width="50%"><span>&nbsp;</span></td>
			</tr>
			<!-- END: select_module -->
			<tr>
				<td width="100%" class="edit view" colspan="3">
					<div id="field_select_block">
						<!-- BEGIN: field_select_block -->
						<table width="100%" class="table-view table-view__step1" border="0" cellspacing="0" cellpadding="0">
							<tr>
								<td width="25%" align="left">{MOD.LBL_AVAIL_FIELDS}:</td>
								<td width="2%">&nbsp;</td>
								<td width="73%">{MOD.LBL_FILTER_COND}:</td>
							</tr>
							<tr id="multi_select_row">
								<td id="field_avail_list_td"><span>
										<div align="left">
											<select name="field_avail_list[]" id="field_avail_list" class="box-select" multiple="multiple" size="10">{FIELD_AVAIL_OPTIONS}</select>
										</div>
									</span></td>
								<td valign="top">
									<div align="center">
										<a onclick="javascript:setselected('field_include_list','field_avail_list');">
											<img src='{RIGHTARROW_BIG_IMAGE}' width='16' height='16' border="0" alt="{LBL_ADD_BUTTON}">
										</a>
									</div>
								</td>
								<td align="left">
									<div id='filter_def' width="100%" align="left">{PRE_LOADED_FIELDS}</div>
								</td>
							</tr>
						</table>
						<!-- END: field_select_block -->
					</div>
				</td>
			</tr>
		</table>
	</div>
</form>

{JAVASCRIPT}
<script type="text/javascript">
	function check_selected_module() {
		if (document.StartDedup.selected_module.value == '') {
			alert("Please select a module to work with.");
			document.StartDedup.selected_module.focus();
			return false;
		} else {
			return true;
		}
	}

	function grab_fields() {}
</script>
<script type="text/javascript" src="modules/MergeRecords/Merge.js?v={VERSION_MARK}"></script>
