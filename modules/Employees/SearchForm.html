<!-- BEGIN: main -->
<table cellpadding="0" cellspacing="0" border="0" width="100%" class="edit view">
	<tr>
		<td>
			<table width="100%" border="0" cellspacing="0" cellpadding="0">
				<tr>
					<td scope="row" nowrap>
						<label> {MOD.LBL_FIRST_NAME} </label>
						<input type="text" size="10" name="first_name_basic" value="{FIRST_NAME}" />
					</td>
					<td scope="row" nowrap>
						<label> {MOD.LBL_LAST_NAME} </label>
						<input type="text" size="10" name="last_name_basic" value="{LAST_NAME}" />
					</td>
					<td scope="row" nowrap>
						<label> {MOD.LBL_DEPARTMENT} </label>
						<input type="text" size="10" name="department_basic" value="{DEPARTMENT}" />
					</td>
					<td scope="row" nowrap>
						<label> {MOD.LBL_EMPLOYEE_STATUS} </label>
						<select class="box-select" name="employee_status_basic">
							{STATUS_OPTIONS}
						</select>
					</td>
				</tr>
			</table>
		</td>
	</tr>
</table>
<!-- END: main -->

<!-- BEGIN: advanced -->
<table cellpadding="0" cellspacing="0" border="0" width="100%" class="edit view">
	<tr>
		<td>
			<table width="100%" border="0" cellspacing="0" cellpadding="0">
				<tr>
					<td width="15%" scope="row">
						<label for="" class="label">{MOD.LBL_FIRST_NAME} </label>
					</td>
					<td width="30%">
						<input name="first_name" tabindex="1" size="25" maxlength="25" type="text" value="{FIRST_NAME}" />
					</td>
				</tr>
				<tr>
					<td scope="row">
						<label for="" class="label">{MOD.LBL_LAST_NAME}</label> 
					</td>
					<td>
						<input class="box-input" name="last_name" type="text" tabindex="1" size="25" maxlength="25" value="{LAST_NAME}" />
					</td>
					<td scope="row">
						<label for="" class="label">{MOD.LBL_EMPLOYEE_STATUS} </label>
					</td>
					<td class="dataField">
						<select class="box-select" tabindex="2" size="3" name="employee_status[]" multiple="true">
							{STATUS_OPTIONS}
						</select>
					</td>
				</tr>
				<tr>
					<td scope="row">
						<label for="" class="label">{MOD.LBL_TITLE} </label>
					</td>
					<td>
						<input class="box-input" name="title" type="text" tabindex="1" size="25" maxlength="100" value="{TITLE}" />
					</td>
					<td scope="row">
						<label for="" class="label">{MOD.LBL_ANY_PHONE} </label>
					</td>
					<td>
						<input class="box-input" name="phone" type="text" tabindex="2" size="20" maxlength="25" value="{PHONE}" />
					</td>
				</tr>
				<tr>
					<td scope="row">
						<label for="" class="label">{MOD.LBL_DEPARTMENT} </label>
					</td>
					<td>
						<input name="department" type="text" tabindex="1" size="25" maxlength="100" value="{DEPARTMENT}" />
					</td>
					<td scope="row">
						<label for="" class="label">{MOD.LBL_ANY_EMAIL} </label>
					</td>
					<td>
						<input class="box-input" name="email" type="text" tabindex="2" size="20" maxlength="100" value="{EMAIL}" />
					</td>
				</tr>
				<tr>
					<td scope="row">
						<label for="" class="label">{MOD.LBL_ADDRESS} </label>
					</td>
					<td>
						<input type="text" name="address_street" tabindex="1" value="{ADDRESS_STREET}" />
					</td>
					<td scope="row">
						<label for="" class="label">{MOD.LBL_CITY} </label>
					</td>
					<td>
						<input class="box-input" name="address_city" tabindex="2" size="15" maxlength="100" value="{ADDRESS_CITY}" />
					</td>
				</tr>
				<tr>
					<td scope="row">
						<label for="" class="label">{MOD.LBL_STATE} </label>
					</td>
					<td>
						<input class="box-input" name="address_state" tabindex="1" size="15" maxlength="100" value="{ADDRESS_STATE}" />
					</td>
					<td scope="row">
						<label for="" class="label">{MOD.LBL_POSTAL_CODE} </label>
					</td>
					<td>
						<input class="box-input" name="address_postalcode" tabindex="2" size="10" maxlength="20" value="{ADDRESS_POSTALCODE}" />
					</td>
				</tr>
				<tr>
					<td scope="row">
						<label for="" class="label">{MOD.LBL_COUNTRY}</label>
					</td>
					<td>
						<input class="box-input" name="address_country" tabindex="1" size="10" maxlength="20" value="{ADDRESS_COUNTRY}" />
					</td>
					<td scope="row">
						<label for="" class="label">&nbsp; </label>
					</td>
					<td>
						<label for="" class="label">&nbsp; </label>
					</td>
				</tr>
				<tr>
					<td colspan="6">&nbsp;</td>
				</tr>
				<tr>
					<td colspan="2">
						<a class="tabFormAdvLink" onhover href="javascript:toggleInlineSearch()"><img
								src="{ADVANCED_SEARCH_IMG}" id="up_down_img" border="0" />
							{APP.LNK_SAVED_VIEWS} </a><br />
						<input type="hidden" id="showSSDIV" name="showSSDIV" value="{SHOWSSDIV}" />
						<p></p>
					</td>

					<td scope="row" width="10%" nowrap="nowrap">
						{MOD_SAVEDSEARCH.LBL_SAVE_SEARCH_AS}
					</td>
					<td width="30%" nowrap>
						<input type="text" name="saved_search_name" />
						<input type="hidden" name="search_module" value="" />
						<input type="hidden" name="saved_search_action" value="" />
						<input title="{APP.LBL_SAVE_BUTTON_LABEL}" value="{APP.LBL_SAVE_BUTTON_LABEL}"
							class="button" type="button" name="saved_search_submit"
							onclick='SUGAR.savedViews.setChooser(); return SUGAR.savedViews.saved_search_action("save");' />
					</td>
					<td scope="row" width="10%" nowrap="nowrap">
						{MOD_SAVEDSEARCH.LBL_MODIFY_CURRENT_SEARCH}:
					</td>
					<td width="30%" nowrap>
						<input class="button"
							onclick='SUGAR.savedViews.setChooser(); return SUGAR.savedViews.saved_search_action("update")'
							value="{APP.LBL_UPDATE}" title="{APP.LBL_UPDATE}" name="ss_update" id="ss_update"
							type="button" />
						<input class="button"
							onclick='return SUGAR.savedViews.saved_search_action("delete", "{MOD_SAVEDSEARCH.LBL_DELETE_CONFIRM}")'
							value="{APP.LBL_DELETE}" title="{APP.LBL_DELETE}" name="ss_delete" id="ss_delete"
							type="button" />
						<br /><span id="curr_search_name"></span>
					</td>
				</tr>

				<tr>
					<td colspan="6">
						<div style="{DISPLAYSS}" id="inlineSavedSearch">{SAVED_SEARCH}</div>
					</td>
				</tr>
			</table>
		</td>
	</tr>
</table>

<script language="javascript" type="text/javascript">
	loadSSL_Scripts();
</script>
<!-- END: advanced -->
